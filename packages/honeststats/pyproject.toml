[project]
name = "honeststats"
version = "0.0.1"
description = "Strategy statistics that account for luck: metrics, bootstrap CIs, walk-forward, deflated Sharpe, PBO."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honeststats"]
